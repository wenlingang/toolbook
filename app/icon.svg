<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141d2c"/>
      <stop offset="1" stop-color="#070a10"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <!-- The macOS icon grid: an 824-point rounded square centred on the
       1024 canvas, so the system uses the icon's own shape. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#22314a" stroke-width="8"/>
  <g transform="translate(512 512) scale(0.92) translate(-512 -512)">
  <rect x="290" y="210" width="450" height="600" rx="48" fill="none" stroke="#3a4a63" stroke-width="22"/>
  <line x1="360" y1="210" x2="360" y2="810" stroke="#3a4a63" stroke-width="14"/>
  <g filter="url(#glow)" opacity="0.9">
    <path d="M440 300 V500 L600 580 V700" stroke="#0fd3c3" stroke-width="40" fill="none" stroke-linejoin="round"/>
  </g>
  <path d="M440 300 V500 L600 580 V700" stroke="#7ffaf0" stroke-width="20" fill="none" stroke-linejoin="round"/>
  <circle cx="440" cy="300" r="44" fill="#0fd3c3"/>
  <circle cx="440" cy="500" r="44" fill="#0fd3c3"/>
  <circle cx="600" cy="580" r="48" fill="#ffb547"/>
  <circle cx="600" cy="700" r="44" fill="#0fd3c3"/>
  </g>
</svg>
