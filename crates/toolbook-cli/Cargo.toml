[package]
name = "toolbook-cli"
description = "The toolbook command: run, describe and list notes."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "toolbook"
path = "src/main.rs"

[dependencies]
toolbook-core = { path = "../toolbook-core" }
clap = { version = "4", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
