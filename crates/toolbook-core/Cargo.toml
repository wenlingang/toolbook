[package]
name = "toolbook-core"
description = "Toolbook engine: notes, blocks, tools and recomputation."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
base64 = "0.22"
percent-encoding = "2"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
serde_json_path = "0.7"
chrono = "0.4"
chrono-tz = "0.10"
similar = "2"
rquickjs = { package = "quickjs-jit", version = "=0.14.1", default-features = false, features = ["std"] }
ureq = "2"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }

[dev-dependencies]
base64 = "0.22"
